<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f9fc"><title>TIME DESIGN | 人生の時間投資</title><style>
:root{--ink:#171d2b;--muted:#778194;--bg:#f6f7fa;--line:#e7eaf0;--red:#e34849;--blue:#4d73c7;--purple:#8a73d4;--teal:#279f93;--amber:#d6a24a;--navy:#2b3449}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--blue)}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.side{background:white;border-right:1px solid var(--line);padding:30px 17px;position:sticky;top:0;height:100vh}.brand{font-weight:850;letter-spacing:.04em;font-size:18px;padding:4px 12px 24px}.brand b{color:var(--red)}.side small{color:var(--muted);font-size:11px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:13px 15px;border-radius:11px;color:#596476;font-weight:650}.nav button.active{background:#fff1f1;color:#d33e43}.sidefoot{position:absolute;bottom:30px;padding:0 13px;color:var(--muted);font-size:12px;line-height:1.7}.main{width:100%;max-width:1200px;margin:0 auto;padding:38px 38px 70px}.top{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:26px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--red);text-transform:uppercase}h1{font-size:30px;letter-spacing:-.04em;margin:8px 0}h2{font-size:19px;margin:0 0 18px}h3{font-size:15px;margin:0 0 12px}.sub{color:var(--muted);line-height:1.7}.pill{border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:white;color:#667184;white-space:nowrap;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.card,.panel{background:white;border:1px solid var(--line);border-radius:17px;box-shadow:0 5px 22px #202a4210}.card{padding:22px}.card .k{font-size:12px;color:var(--muted);margin-bottom:12px}.big{font-size:29px;font-weight:800;letter-spacing:-.04em}.big span{font-size:13px;font-weight:500;color:var(--muted)}.note{font-size:11px;color:var(--muted);line-height:1.7;margin-top:10px}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.panel{padding:24px;margin-bottom:18px}.bar{display:flex;overflow:hidden;border-radius:8px;height:22px;background:#edf0f4;margin:16px 0}.bar div{min-width:0}.legend{display:grid;gap:12px}.legenditem{display:flex;align-items:center;gap:10px}.dot{height:9px;width:9px;border-radius:3px;flex:none}.legenditem .grow{flex:1}.legenditem strong{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.metric{display:flex;align-items:baseline;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);gap:12px}.metric:last-child{border:0}.meter{height:7px;background:#edf0f4;border-radius:10px;overflow:hidden;margin-top:8px}.meter>div{height:100%;border-radius:10px;background:var(--red)}.btn{border:0;border-radius:10px;background:var(--red);color:white;padding:11px 15px;font-weight:700}.btn.secondary{background:#f0f2f6;color:var(--ink)}.btn.outline{background:white;border:1px solid var(--line);color:var(--ink)}.btn.small{padding:8px 10px;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sectionhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.sectionhead h2{margin:0}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.inputrow{display:grid;grid-template-columns:1fr 110px;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}input,select,textarea{border:1px solid #dfe3eb;border-radius:9px;padding:10px;background:white;color:var(--ink);width:100%}textarea{resize:vertical;min-height:90px}label{font-size:13px;font-weight:650}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:480px}th{text-align:left;color:var(--muted);font-size:11px;font-weight:700}td,th{padding:13px 10px;border-bottom:1px solid var(--line)}td:last-child,th:last-child{text-align:right}.tag{display:inline-block;background:#f2f4f7;color:#626d7e;padding:5px 8px;border-radius:7px;font-size:11px;font-weight:700}.tag.done{background:#e5f6ee;color:#14815a}.tag.progress{background:#fff1dd;color:#a56a12}.item{border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:10px}.itemhead{display:flex;align-items:start;justify-content:space-between;gap:10px}.item h3{margin:0 0 8px}.item p{margin:7px 0;color:#667184;font-size:12px;line-height:1.6}.hide{display:none!important}.toast{position:fixed;bottom:24px;right:24px;background:#20283a;color:white;padding:13px 18px;border-radius:12px;display:none;z-index:20}.footnote{font-size:12px;color:var(--muted);line-height:1.8}.bottomnav{display:none}.empty{color:var(--muted);text-align:center;padding:30px 8px}.progressbar{background:#edf0f4;height:10px;border-radius:99px;overflow:hidden}.progressbar div{height:100%;background:var(--teal)}@media(max-width:1020px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.main{padding:26px 22px 80px}}@media(max-width:680px){.app{display:block}.side{display:none}.main{padding:23px 15px 100px}.top{margin-bottom:20px}.top .pill{display:none}h1{font-size:25px}.cards{gap:9px}.card{padding:15px;border-radius:13px}.big{font-size:23px}.panel{padding:18px;border-radius:14px}.grid2{grid-template-columns:1fr}.bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:10}.bottomnav button{border:0;background:none;color:#8790a0;font-size:10px;padding:6px 1px;display:grid;gap:4px;justify-items:center}.bottomnav button span{font-size:20px}.bottomnav button.active{color:var(--red);font-weight:800}.metric{font-size:12px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">TIME <b>DESIGN.</b><br><small>MY LIFE INVESTMENT</small></div><nav class="nav" id="nav"></nav><div class="sidefoot">未来の可能性を増やす<br>時間の使い方を、見える化する。<br><br>2026年10月版</div></aside><main class="main"><div class="top"><div><div class="eyebrow" id="eyebrow">OVERVIEW</div><h1 id="pageTitle">時間投資ダッシュボード</h1><div class="sub" id="pageSub">時間を消費するのではなく、未来の可能性を増やす。</div></div><div class="pill">● ローカル保存 / GitHub Pages対応</div></div><div id="view"></div></main></div><nav class="bottomnav" id="mobileNav"></nav><div class="toast" id="toast"></div><script>
'use strict';
const BASE={year:2026,total:8760,categories:[{id:'sleep',name:'睡眠',hours:2455,color:'#64748b'},{id:'work',name:'仕事',hours:1957,color:'#4d73c7'},{id:'commute',name:'通勤',hours:732,color:'#279f93'},{id:'overtime',name:'残業',hours:488,color:'#d6a24a'},{id:'free',name:'自由時間',hours:3133,color:'#8a73d4'}],free:[{id:'family',name:'家族との時間',hours:1040,color:'#4d73c7'},{id:'living',name:'生活維持',hours:730,color:'#9aa4b5'},{id:'baseball',name:'野球・親友との対話',hours:260,color:'#279f93'},{id:'training',name:'筋トレ',hours:104,color:'#d6a24a'},{id:'meditation',name:'瞑想・思考整理',hours:104,color:'#64748b'},{id:'experience',name:'新しい経験・挑戦',hours:240,color:'#e34849'},{id:'sidebusiness',name:'副業・ものづくり',hours:200,color:'#8a73d4'},{id:'rest',name:'休息・娯楽',hours:200,color:'#df8aa2'},{id:'buffer',name:'予備・調整',hours:255,color:'#c7cdd8'}],experiences:[{id:1,title:'デニム作り（ベティスミス）',status:'希望',type:'ものづくり',month:'2026-10',note:'恵比寿工房。料金・予約枠を確認してから実行。'},{id:2,title:'POPUPストア運営（2日間）',status:'確定',type:'事業',month:'2026-10',note:'接客・販売・顧客理解を経験する。'},{id:3,title:'映画鑑賞（ストリートファイター／ちいかわ）',status:'希望',type:'娯楽',month:'2026-10',note:'上映時期・作品情報は未確認。'},{id:4,title:'パラコードアクセサリー制作',status:'進行中',type:'ものづくり',month:'2026-10',note:'配色・仕上げ品質・商品開発を改善。'},{id:5,title:'劇団四季「アラジン」',status:'希望',type:'芸術',month:'2026-10',note:'公演日・空席を確認。'},{id:6,title:'Podcast 第1回エピソード編集',status:'進行中',type:'発信',month:'2026-10',note:'1回目録音済み。10/25に2回目録音予定。2本を編集して1本完成。公開は後日。'}],logs:[],settings:{monthlyBudget:25000,monthlyTarget:2,overtimeReduction:100}};
const KEY='time-design-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(BASE)}catch{data=JSON.parse(JSON.stringify(BASE))}let page='overview';const $=s=>document.querySelector(s),sum=a=>a.reduce((x,y)=>x+Number(y.hours||0),0),fmt=n=>Math.round(n).toLocaleString('ja-JP'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(data));toast('保存しました')}function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',2400)}const pages=[['overview','◫','全体像','OVERVIEW','時間投資ダッシュボード','年間8,760時間を、人生の可能性につなげる。'],['allocation','◴','時間配分','ALLOCATION','時間配分を設計','数値を編集すると全体像に反映されます。'],['experiences','✦','挑戦リスト','EXPERIENCES','新しい経験・挑戦','やってみたいことを、実行したことへ。'],['journal','▤','行動ログ','JOURNAL','記録と振り返り','時間だけでなく、残った価値を記録する。'],['settings','⚙','設定・保存','SETTINGS','設定とバックアップ','端末間のデータ移行と計画値の管理。']];function nav(){for(const target of ['#nav','#mobileNav'])$(target).innerHTML=pages.map(p=>`<button class="${p[0]===page?'active':''}" onclick="go('${p[0]}')"><span>${p[1]}</span>${p[2]}</button>`).join('')}function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}function render(){nav();let p=pages.find(x=>x[0]===page);$('#eyebrow').textContent=p[3];$('#pageTitle').textContent=p[4];$('#pageSub').textContent=p[5];$('#view').innerHTML=({overview,allocation,experiences,journal,settings})[page]()}function stacked(items){let total=sum(items);return `<div class="bar">${items.map(i=>`<div title="${esc(i.name)} ${fmt(i.hours)}時間" style="flex:${Math.max(0,i.hours)};background:${i.color}"></div>`).join('')}</div><div class="legend">${items.map(i=>`<div class="legenditem"><span class="dot" style="background:${i.color}"></span><span class="grow">${esc(i.name)}</span><strong>${fmt(i.hours)}h</strong><span class="muted">${total?Math.round(i.hours/total*100):0}%</span></div>`).join('')}</div>`}function card(k,v,sub){return `<div class="card"><div class="k">${k}</div><div class="big">${v}</div><div class="note">${sub}</div></div>`}function overview(){let cat=sum(data.categories),free=sum(data.free),diff=cat-data.total,exper=data.experiences.filter(x=>x.status==='完了').length;return `<div class="cards">${card('年間の総時間',fmt(data.total)+'<span> h</span>','365日 × 24時間')}${card('自由時間',fmt(data.categories.find(x=>x.id==='free').hours)+'<span> h</span>','家族・経験・健康・休息')}${card('新しい経験',fmt(data.free.find(x=>x.id==='experience').hours)+'<span> h</span>','年間の計画値')}${card('残業削減目標','−'+fmt(data.settings.overtimeReduction)+'<span> h</span>','実績が出てから再配分')}</div><div class="layout"><div><div class="panel"><div class="sectionhead"><h2>年間の時間配分</h2><button class="btn small secondary" onclick="go('allocation')">編集する →</button></div>${stacked(data.categories)}<p class="footnote">集計差：<b>${diff>0?'+':''}${fmt(diff)}h</b>（元データは +5h）。数値は計画値であり実績値ではありません。</p></div><div class="panel"><div class="sectionhead"><h2>自由時間の内訳</h2><button class="btn small secondary" onclick="go('allocation')">編集する →</button></div>${stacked(data.free)}<p class="footnote">自由時間枠との差：${fmt(data.categories.find(x=>x.id==='free').hours-free)}h。読書は通勤時間で計上。活動が重複した場合は主分類で記録。</p></div></div><div><div class="panel"><h2>今月の実行状況</h2><div class="metric"><span>体験完了（全期間）</span><strong>${exper}件</strong></div><div class="metric"><span>月間体験目標</span><strong>${data.settings.monthlyTarget}件</strong></div><div class="metric"><span>月間体験予算</span><strong>¥${fmt(data.settings.monthlyBudget)}</strong></div><button class="btn" style="width:100%;margin-top:16px" onclick="go('experiences')">挑戦リストを見る →</button></div><div class="panel"><h2>時間投資の4つの判断軸</h2>${['時間制約性｜今しかできないか','目的直結性｜なりたい自分につながるか','資産性｜経験・能力・人脈・成果が残るか','波及効果｜他の領域にも価値が広がるか'].map(x=>`<div class="metric">${x}</div>`).join('')}<p class="footnote">各5点、20点満点。点数は意思決定の補助であり、楽しさを否定するものではありません。</p></div></div></div>`}function allocation(){return `<div class="grid2"><div class="panel"><h2>年間の大分類</h2>${data.categories.map((x,i)=>`<div class="inputrow"><label>${esc(x.name)}</label><input type="number" min="0" value="${x.hours}" onchange="updateHours('categories',${i},this.value)"></div>`).join('')}<p class="footnote">合計 ${fmt(sum(data.categories))}h ／ 基準 ${fmt(data.total)}h ／ 差 ${fmt(sum(data.categories)-data.total)}h</p></div><div class="panel"><h2>自由時間の詳細</h2>${data.free.map((x,i)=>`<div class="inputrow"><label>${esc(x.name)}</label><input type="number" min="0" value="${x.hours}" onchange="updateHours('free',${i},this.value)"></div>`).join('')}<p class="footnote">合計 ${fmt(sum(data.free))}h ／ 自由時間枠 ${fmt(data.categories.find(x=>x.id==='free').hours)}h</p></div></div><div class="panel"><h2>使い方のルール</h2><div class="grid2"><div><h3>仕事｜約196hを将来へ</h3><p class="sub">経営者交流72h ／ 事業仮説・企画48h ／ チーム形成・検証・販売76h。成果は実際の売上で測る。</p></div><div><h3>通勤｜732h</h3><p class="sub">読書・一般教養35% ／ 仕事スキル25% ／ 娯楽・刺激25% ／ 内省15%。読書を自由時間に重複計上しない。</p></div><div><h3>残業｜488h → 388h</h3><p class="sub">価値ある1on1は維持し、不要な会議を減らす。削減できた時間だけ、経験40%・家族25%・副業20%・健康15%へ。</p></div><div><h3>自由時間｜守る＋挑戦</h3><p class="sub">家族・野球・筋トレ・瞑想を維持し、月2回の新しい経験を実行。生活維持2h/日は概算。</p></div></div></div>`}function updateHours(key,i,val){data[key][i].hours=Math.max(0,Number(val)||0);save();render()}function experiences(){let month=new Date().toISOString().slice(0,7);return `<div class="cards">${card('登録した挑戦',data.experiences.length+'<span> 件</span>','興味・計画・進行中を含む')}${card('完了',data.experiences.filter(x=>x.status==='完了').length+'<span> 件</span>','実際にやった経験')}${card('月間目標',data.settings.monthlyTarget+'<span> 回</span>','年間24回が目安')}${card('体験予算','¥'+fmt(data.settings.monthlyBudget),'毎月の上限目安')}</div><div class="layout"><div class="panel"><div class="sectionhead"><h2>挑戦ボード</h2><span class="tag">状態を変更できます</span></div>${data.experiences.map((x,i)=>`<div class="item"><div class="itemhead"><div><h3>${esc(x.title)}</h3><span class="tag">${esc(x.type)}</span> <span class="tag">${esc(x.month)}</span></div><select style="width:105px" onchange="changeStatus(${i},this.value)">${['希望','計画中','確定','進行中','完了','保留'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div><p>${esc(x.note)}</p><div class="row"><button class="btn small outline" onclick="editExperience(${i})">編集</button><button class="btn small outline" onclick="removeExperience(${i})">削除</button></div></div>`).join('')||'<div class="empty">まだ登録がありません</div>'}</div><div><div class="panel"><h2>新しい挑戦を追加</h2><form onsubmit="addExperience(event)"><label>やりたいこと</label><input required name="title" placeholder="例：親子で初めての陶芸" style="margin:8px 0 15px"><label>分類</label><select name="type" style="margin:8px 0 15px"><option>新体験</option><option>ものづくり</option><option>事業</option><option>家族</option><option>身体</option><option>芸術</option><option>娯楽</option><option>発信</option></select><label>実行月</label><input name="month" type="month" value="${month}" style="margin:8px 0 15px"><label>目的・メモ</label><textarea name="note" placeholder="なぜやりたい？ 何が残る？" style="margin:8px 0 15px"></textarea><button class="btn" style="width:100%">追加する</button></form></div><div class="panel"><h2>実行ルール</h2><p class="sub">毎月1日に候補3つを検討。月2回を目標に、一人の挑戦と家族・仲間との経験を組み合わせる。</p><p class="sub">各体験のあと、3分で「新しかったこと・感じたこと・次に試すこと」を記録する。</p><button class="btn secondary" onclick="go('journal')">振り返りを記録 →</button></div></div></div>`}function changeStatus(i,s){data.experiences[i].status=s;save();render()}function addExperience(e){e.preventDefault();let f=new FormData(e.target);data.experiences.unshift({id:Date.now(),title:String(f.get('title')).trim(),type:String(f.get('type')),month:String(f.get('month')),status:'希望',note:String(f.get('note'))});save();render()}function editExperience(i){let x=data.experiences[i],title=prompt('タイトル',x.title);if(title===null)return;let note=prompt('目的・メモ',x.note);if(note===null)return;x.title=title.trim()||x.title;x.note=note;save();render()}function removeExperience(i){if(confirm('この挑戦を削除しますか？')){data.experiences.splice(i,1);save();render()}}function journal(){return `<div class="layout"><div class="panel"><h2>今日の行動・気づきを記録</h2><form onsubmit="addLog(event)"><label>日付</label><input name="date" type="date" required value="${new Date().toLocaleDateString('sv-SE')}" style="margin:8px 0 15px"><label>分類</label><select name="category" style="margin:8px 0 15px">${data.free.filter(x=>x.id!=='living'&&x.id!=='buffer').map(x=>`<option>${esc(x.name)}</option>`).join('')}<option>仕事</option><option>通勤</option></select><label>使った時間（時間単位）</label><input name="hours" type="number" min="0" max="24" step="0.25" required placeholder="例：1.5" style="margin:8px 0 15px"><label>やったこと</label><input name="activity" required placeholder="例：パラコードの配色を試した" style="margin:8px 0 15px"><label>新しかったこと・感じたこと・次の一歩</label><textarea name="insight" placeholder="うまく書かなくてOK。1行でも。" style="margin:8px 0 15px"></textarea><button class="btn" style="width:100%">ログを保存</button></form></div><div class="panel"><div class="sectionhead"><h2>行動ログ</h2><span class="tag">${data.logs.length}件</span></div>${data.logs.length?data.logs.map((x,i)=>`<div class="item"><div class="itemhead"><h3>${esc(x.activity)}</h3><button class="btn small outline" onclick="removeLog(${i})">削除</button></div><p>${esc(x.date)} · ${esc(x.category)} · ${esc(x.hours)}h</p><p>${esc(x.insight)}</p></div>`).join(''):'<div class="empty">まだ記録がありません。<br>まず1つ、今日やったことを残しましょう。</div>'}</div></div><div class="panel"><h2>月末の5分振り返り</h2><div class="grid2">${['初めてやったことは？','できるようになったことは？','家族・仲間と作った思い出は？','知識・人脈・作品・売上など、何が残った？','来月、何を減らして何を増やす？'].map((x,i)=>`<div class="metric"><span><b>0${i+1}</b> ${x}</span></div>`).join('')}</div></div>`}function addLog(e){e.preventDefault();let f=new FormData(e.target);data.logs.unshift(Object.fromEntries(f.entries()));save();render()}function removeLog(i){if(confirm('このログを削除しますか？')){data.logs.splice(i,1);save();render()}}function settings(){return `<div class="layout"><div><div class="panel"><h2>目標設定</h2><div class="inputrow"><label>年間総時間（時間）</label><input type="number" value="${data.total}" onchange="data.total=Number(this.value)||8760;save();render()"></div><div class="inputrow"><label>月間体験予算（円）</label><input type="number" value="${data.settings.monthlyBudget}" onchange="data.settings.monthlyBudget=Number(this.value)||0;save();render()"></div><div class="inputrow"><label>月間体験目標（回）</label><input type="number" value="${data.settings.monthlyTarget}" onchange="data.settings.monthlyTarget=Number(this.value)||0;save();render()"></div><div class="inputrow"><label>年間残業削減目標（時間）</label><input type="number" value="${data.settings.overtimeReduction}" onchange="data.settings.overtimeReduction=Number(this.value)||0;save();render()"></div></div><div class="panel"><h2>データのバックアップ</h2><p class="sub">このアプリはデータをブラウザ内に保存します。PCとスマホ間で自動同期はしません。JSONファイルをエクスポートして、別の端末でインポートできます。</p><div class="row"><button class="btn" onclick="exportData()">JSONを書き出す</button><label class="btn secondary" style="cursor:pointer">JSONを読み込む<input style="display:none" type="file" accept="application/json,.json" onchange="importData(event)"></label></div></div></div><div><div class="panel"><h2>利用上の注意</h2><p class="sub">計画値と実績値は別です。元の年間集計には5時間の差があります。生活維持730時間は1日2時間の概算です。</p><p class="sub">GitHub Pages上では、保存した記録は端末・ブラウザごとに管理されます。ブラウザのデータ削除時に失われる可能性があるため、定期的にJSONを保存してください。</p></div><div class="panel"><h2>初期状態に戻す</h2><p class="sub">入力した挑戦・行動ログ・設定が削除されます。</p><button class="btn outline" onclick="resetData()">初期データに戻す</button></div></div></div>`}function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='time-design-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){let f=e.target.files?.[0];if(!f)return;f.text().then(t=>{let x=JSON.parse(t);if(!Array.isArray(x.categories)||!Array.isArray(x.free)||!Array.isArray(x.experiences)||!Array.isArray(x.logs)||!x.settings)throw Error('形式が違います');if(!confirm('現在のデータを読み込んだ内容で上書きしますか？'))return;data=x;save();render()}).catch(err=>alert('読み込みに失敗しました：'+err.message))}function resetData(){if(confirm('本当にすべての記録を初期化しますか？')){data=JSON.parse(JSON.stringify(BASE));save();render()}}render();
</script></body></html>
